version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: caracaltech_postgres
    environment:
      POSTGRES_USER: caracaltech
      POSTGRES_PASSWORD: caracaltech_dev_password
      POSTGRES_DB: caracaltech_ecu
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caracaltech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caracaltech_network

  typesense:
    image: typesense/typesense:latest
    container_name: caracaltech_typesense
    environment:
      TYPESENSE_API_KEY: caracaltech_typesense_key_dev
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    ports:
      - "8108:8108"
    command: --data-dir /data --api-key=caracaltech_typesense_key_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caracaltech_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caracaltech_api
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: caracaltech
      DB_PASSWORD: caracaltech_dev_password
      DB_NAME: caracaltech_ecu
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: caracaltech_typesense_key_dev
      API_PORT: 3000
      API_HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - caracaltech_network
    command: npm run dev

volumes:
  postgres_data:
  typesense_data:

networks:
  caracaltech_network:
    driver: bridge
