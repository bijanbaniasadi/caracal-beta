name: caracal-production

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot:/var/www/certbot:ro
      - /var/www/caracal-media:/usr/share/nginx/media:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health/live >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
        NEXT_PUBLIC_NEW_CATALOG_FRONTEND: ${NEXT_PUBLIC_NEW_CATALOG_FRONTEND:-false}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-old-space-size=512}
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      NEXT_PUBLIC_NEW_CATALOG_FRONTEND: ${NEXT_PUBLIC_NEW_CATALOG_FRONTEND:-false}
      NEW_CATALOG_FRONTEND: ${NEW_CATALOG_FRONTEND:-false}
    expose:
      - '3000'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=768}
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://typesense:8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      TYPESENSE_COLLECTION_ALIAS: ${TYPESENSE_COLLECTION_ALIAS:-products}
      TYPESENSE_COLLECTION_PREFIX: ${TYPESENSE_COLLECTION_PREFIX:-products}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      BIN_ANALYSIS_AUTO_QUEUE: ${BIN_ANALYSIS_AUTO_QUEUE:-true}
      BIN_ANALYSIS_QUEUE_NAME: ${BIN_ANALYSIS_QUEUE_NAME:-bin-analysis}
    expose:
      - '3001'
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health/ready >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      BIN_ANALYSIS_QUEUE_NAME: ${BIN_ANALYSIS_QUEUE_NAME:-bin-analysis}
      BIN_ANALYSIS_WORKER_CONCURRENCY: ${BIN_ANALYSIS_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api-projection-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/projection-worker.js']
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://typesense:8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      TYPESENSE_COLLECTION_ALIAS: ${TYPESENSE_COLLECTION_ALIAS:-products}
      TYPESENSE_COLLECTION_PREFIX: ${TYPESENSE_COLLECTION_PREFIX:-products}
      CATALOG_PROJECTION_WORKER_CONCURRENCY: ${CATALOG_PROJECTION_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    volumes:
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  ingestion-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/ingestion-worker.js']
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      CATALOG_INGESTION_WORKER_CONCURRENCY: ${CATALOG_INGESTION_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  fingerprint-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/fingerprint-worker.js']
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CATALOG_FINGERPRINT_WORKER_CONCURRENCY: ${CATALOG_FINGERPRINT_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  image-pipeline-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/image-pipeline-worker.js']
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      CATALOG_IMAGE_PIPELINE_WORKER_CONCURRENCY: ${CATALOG_IMAGE_PIPELINE_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  reconciliation-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/reconciliation-worker.js']
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CATALOG_RECONCILIATION_WORKER_CONCURRENCY: ${CATALOG_RECONCILIATION_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  fx-rates-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/fx-rates-worker.js']
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CATALOG_FX_RATES_WORKER_CONCURRENCY: ${CATALOG_FX_RATES_WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  typesense:
    image: typesense/typesense:30.2
    command:
      [
        '--data-dir',
        '/data',
        '--api-key',
        '${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}',
        '--listen-port',
        '8108',
      ]
    expose:
      - '8108'
    volumes:
      - typesense-data:/data
      - catalog-backups:/backups
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  postgres-backup:
    image: postgres:15-alpine
    profiles: ['backup']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    command:
      [
        'sh',
        '-c',
        'mkdir -p /backups/postgres && pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" --format=custom --file="/backups/postgres/caracal-$$(date +%Y%m%d%H%M%S).dump" && find /backups/postgres -type f -mtime +"$$BACKUP_RETENTION_DAYS" -delete',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - catalog-backups:/backups

  typesense-backup:
    image: curlimages/curl:8.11.1
    profiles: ['backup']
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    command:
      [
        'sh',
        '-c',
        'mkdir -p /backups/typesense && curl -fsS -X POST "http://typesense:8108/operations/snapshot?snapshot_path=/backups/typesense/typesense-$$(date +%Y%m%d%H%M%S)" -H "X-TYPESENSE-API-KEY: $$TYPESENSE_API_KEY" && find /backups/typesense -mindepth 1 -mtime +"$$BACKUP_RETENTION_DAYS" -exec rm -rf {} +',
      ]
    depends_on:
      typesense:
        condition: service_started
    volumes:
      - catalog-backups:/backups

volumes:
  api-logs:
    name: caracal-api-logs
  api-uploads:
    name: caracal-api-uploads
  nginx-logs:
    name: caracal-nginx-logs
  postgres-data:
    name: caracal-postgres-data
  redis-data:
    name: caracal-redis-data
  typesense-data:
    name: caracal-typesense-data
  catalog-backups:
    name: caracal-catalog-backups
