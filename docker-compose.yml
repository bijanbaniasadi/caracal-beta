services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://caracal:caracal_dev@postgres:5432/caracal_dev
      REDIS_URL: redis://redis:6379
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      BIN_ANALYSIS_AUTO_QUEUE: 'true'
      BIN_ANALYSIS_QUEUE_NAME: bin-analysis
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
  api-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://caracal:caracal_dev@postgres:5432/caracal_dev
      REDIS_URL: redis://redis:6379
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      BIN_ANALYSIS_QUEUE_NAME: bin-analysis
      BIN_ANALYSIS_WORKER_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
  api-ecu-corpus-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/ecu-corpus-worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://caracal:caracal_dev@postgres:5432/caracal_dev
      REDIS_URL: redis://redis:6379
      ECU_CORPUS_ROOT: ${ECU_CORPUS_ROOT:-/data/ecu-corpus}
      ECU_CORPUS_QUEUE_PREFIX: ecu-corpus
      ECU_CORPUS_WORKER_CONCURRENCY: ${ECU_CORPUS_WORKER_CONCURRENCY:-2}
      ECU_CORPUS_DISCOVERY_BATCH_SIZE: ${ECU_CORPUS_DISCOVERY_BATCH_SIZE:-2000}
      ECU_CORPUS_FINGERPRINT_BATCH_SIZE: ${ECU_CORPUS_FINGERPRINT_BATCH_SIZE:-100}
      ECU_CORPUS_MAX_ANALYSIS_BYTES: ${ECU_CORPUS_MAX_ANALYSIS_BYTES:-262144}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${ECU_CORPUS_HOST_PATH:-./data/ecu-corpus}:/data/ecu-corpus:ro
      - api-logs:/app/logs/api
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: caracal
      POSTGRES_PASSWORD: caracal_dev
      POSTGRES_DB: caracal_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caracal -d caracal_dev']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api-logs:
  api-uploads:
  postgres-data:
