services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://caracal:caracal_dev@postgres:5432/caracal_dev
      REDIS_URL: redis://redis:6379
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: dev-typesense-key
      TYPESENSE_COLLECTION_ALIAS: products
      TYPESENSE_COLLECTION_PREFIX: products
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      BIN_ANALYSIS_AUTO_QUEUE: 'true'
      BIN_ANALYSIS_QUEUE_NAME: bin-analysis
    ports:
      - '3001:3001'
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health/ready >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://caracal:caracal_dev@postgres:5432/caracal_dev
      REDIS_URL: redis://redis:6379
      LOCAL_UPLOAD_DIR: /app/apps/api/uploads
      BIN_ANALYSIS_QUEUE_NAME: bin-analysis
      BIN_ANALYSIS_WORKER_CONCURRENCY: 2
      WORKER_SHUTDOWN_TIMEOUT_MS: 30000
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api-ecu-corpus-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-worker
    command: ['node', 'dist/workers/ecu-corpus-worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://caracal:caracal_dev@postgres:5432/caracal_dev
      REDIS_URL: redis://redis:6379
      ECU_CORPUS_ROOT: ${ECU_CORPUS_ROOT:-/data/ecu-corpus}
      ECU_CORPUS_QUEUE_PREFIX: ecu-corpus
      ECU_CORPUS_WORKER_CONCURRENCY: ${ECU_CORPUS_WORKER_CONCURRENCY:-2}
      ECU_CORPUS_DISCOVERY_BATCH_SIZE: ${ECU_CORPUS_DISCOVERY_BATCH_SIZE:-2000}
      ECU_CORPUS_FINGERPRINT_BATCH_SIZE: ${ECU_CORPUS_FINGERPRINT_BATCH_SIZE:-100}
      ECU_CORPUS_MAX_ANALYSIS_BYTES: ${ECU_CORPUS_MAX_ANALYSIS_BYTES:-262144}
      ECU_CORPUS_QUEUE_BACKPRESSURE_MAX_DEPTH: ${ECU_CORPUS_QUEUE_BACKPRESSURE_MAX_DEPTH:-5000}
      ECU_CORPUS_WORKER_MEMORY_LIMIT_BYTES: ${ECU_CORPUS_WORKER_MEMORY_LIMIT_BYTES:-1610612736}
      WORKER_SHUTDOWN_TIMEOUT_MS: 30000
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${ECU_CORPUS_HOST_PATH:-./data/ecu-corpus}:/data/ecu-corpus:ro
      - api-logs:/app/logs/api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(''node:net''); const s=net.connect(6379,''redis'',()=>process.exit(0)); s.on(''error'',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000).unref()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
