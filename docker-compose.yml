  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: caracal
      POSTGRES_PASSWORD: caracal_dev
      POSTGRES_DB: caracal_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caracal -d caracal_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  typesense:
    image: typesense/typesense:30.2
    command:
      [
        '--data-dir',
        '/data',
        '--api-key',
        '${TYPESENSE_API_KEY:-dev-typesense-key}',
        '--listen-port',
        '8108',
      ]
    ports:
      - '8108:8108'
    volumes:
      - typesense-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  api-logs:
  api-uploads:
  postgres-data:
  typesense-data:
